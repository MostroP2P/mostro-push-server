[package]
name = "mostro-push-backend"
version = "0.2.0"
edition = "2021"

[dependencies]
# Web framework
# Default features minus compress-brotli/compress-gzip/compress-zstd. Actix
# applies request decompression inside the JSON extractor, before the
# `JsonConfig::limit` check, into an unbounded buffer: 316 bytes of brotli
# decode to 382 MB on an unauthenticated endpoint. Without `__compress`
# there is no decompressor, so a compressed body reaches serde_json as
# opaque bytes and is refused by the existing malformed-body path.
# Re-adding any compress-* feature reopens that; see the regression tests
# in src/api/routes.rs.
actix-web = { version = "4.9", default-features = false, features = [
    "macros",
    "cookies",
    "http2",
    "unicode",
    "compat",
] }
actix-rt = "2.9"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# JSON handling
serde = { version = "1.0", features = ["derive"] }
# `preserve_order` is load-bearing, not a preference. Several response bodies
# are built with the `json!` macro, and CLAUDE.md hard constraint 3 requires
# them to stay byte-identical to the pre-1.1 fixtures. Without this feature
# serde_json's Map is a BTreeMap and serialises keys alphabetically, which
# reorders `{"success":..,"message":..}` into `{"message":..,"success":..}`.
# nostr-sdk 0.27 used to enable it transitively; 0.45 does not, so it is
# declared here explicitly. See #37 for making the contract self-enforcing.
serde_json = { version = "1.0", features = ["preserve_order"] }

# HTTP client for FCM and UnifiedPush
reqwest = { version = "0.11", features = ["json"] }

# Nostr
nostr-sdk = "0.45"

# Logging
env_logger = "0.11"
log = "0.4"

# Configuration
config = "0.14"
dotenv = "0.15"

# Async utilities
futures = "0.3"
async-trait = "0.1"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Rate limiting
governor = "0.6"

# Cryptography for token encryption (MIP-05 style)
blake3 = "1"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
secp256k1 = { version = "0.28", features = ["rand-std"] }
rand = "0.8"
hex = "0.4"
base64 = "0.21"

# JWT for Firebase service account authentication
jsonwebtoken = "9"

# Identifiers
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
mockito = "1.2"
